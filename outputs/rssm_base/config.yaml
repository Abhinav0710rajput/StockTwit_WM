eval:
  attn_top_n: 50
  cf_delta: 3.0
  context_len: 52
  horizons:
  - 1
  - 4
  - 13
  kl_spike_z_threshold: 2.0
  latent_n_clusters: 5
  latent_tsne_perp: 30
  latent_umap_neighbors: 15
  n_samples: 20
  precision_at_k: 100
  use_prior_mean: true
  virality_horizon: 4
  virality_top_n: 20
model:
  d_enc: 256
  dropout: 0.1
  embed_dim: 64
  feature_dim: 5
  h_dim: 512
  mlp_hidden: 256
  n_heads: 8
  n_layers: 2
  s_dim: 256
  top_k: 100
  window_k: 8
train:
  batch_size: 32
  bce_pos_weight: 10.0
  beta_anneal_epochs: 30
  beta_end: 1.0
  beta_start: 0.1
  free_nats: 0.5
  grad_clip: 10.0
  lambda_mse: 1.0
  lr: 0.0003
  max_epochs: 100
  num_workers: 4
  patience: 15
  seq_len: 52
  warmup_epochs: 5
  weight_decay: 1.0e-05
