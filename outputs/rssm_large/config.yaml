eval:
  attn_top_n: 50
  cf_delta: 3.0
  context_len: 52
  horizons:
  - 1
  - 4
  - 13
  kl_spike_z_threshold: 2.0
  latent_n_clusters: 5
  latent_tsne_perp: 30
  latent_umap_neighbors: 15
  n_samples: 20
  precision_at_k: 100
  use_prior_mean: true
  virality_horizon: 4
  virality_top_n: 20
model:
  d_enc: 512
  dropout: 0.15
  embed_dim: 128
  feature_dim: 5
  h_dim: 1024
  mlp_hidden: 512
  n_heads: 16
  n_layers: 4
  s_dim: 256
  top_k: 100
  window_k: 8
train:
  batch_size: 16
  bce_pos_weight: 10.0
  beta_anneal_epochs: 60
  beta_end: 0.15
  beta_hold_epochs: 20
  beta_start: 0.1
  free_nats: 1.0
  grad_clip: 1.0
  label_smoothing: 0.05
  lambda_mse: 1.0
  lr: 0.0001
  max_epochs: 200
  num_workers: 4
  patience: 60
  seq_len: 64
  warmup_epochs: 10
  weight_decay: 1.0e-05
